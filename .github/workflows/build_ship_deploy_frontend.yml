name: Frontend - Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-release
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.release.tag_name || github.sha }}
  FRONTEND_BUCKET: ${{ secrets.LIVE_FRONTEND_BUCKET_NAME }}
  ARTIFACTS_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
  SITE_URL: ${{ secrets.SITE_URL }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js and Cache (Frontend)
        uses: ./.github/actions/setup-node-cache
        with:
          node-version: '24.11.1'
          working-directory: 'frontend'
          cache-key-prefix: 'frontend'

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
        env:
          NODE_ENV: production

      # Lets the switch step confirm the new build is really being served
      - name: Stamp version
        run: echo "$VERSION" > frontend/dist/version.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-frontend-release
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find the key-value store
        run: |
          KVS_ARN=$(aws cloudfront list-key-value-stores \
            --query "KeyValueStoreList.Items[?Name=='frontend-release'].ARN | [0]" --output text)
          echo "KVS_ARN=$KVS_ARN" >> "$GITHUB_ENV"

      # Backup first: if anything below fails, the release is still recoverable
      - name: Archive build to artifacts bucket
        run: |
          tar -czf frontend-artifact.tar.gz -C frontend/dist .
          aws s3 cp frontend-artifact.tar.gz \
            "s3://$ARTIFACTS_BUCKET/frontend/frontend-$VERSION.tar.gz"

      - name: Upload to versioned prefix
        run: bash .github/scripts/upload-frontend.sh frontend/dist "$FRONTEND_BUCKET" "$VERSION"

      - name: Switch live version
        run: bash .github/scripts/switch-frontend.sh "$VERSION"
