name: Frontend - Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to roll back to (e.g. v1.0.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: frontend-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  FRONTEND_BUCKET: ${{ secrets.LIVE_FRONTEND_BUCKET_NAME }}
  ARTIFACTS_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
  KVS_ARN: ${{ secrets.CLOUDFRONT_KVS_ARN }}
  SITE_URL: ${{ secrets.SITE_URL }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Restore version if it is missing from the live bucket
        run: |
          if aws s3api head-object --bucket "$FRONTEND_BUCKET" \
               --key "$VERSION/index.html" > /dev/null 2>&1; then
            echo "Version $VERSION is still in the frontend bucket."
          else
            echo "Restoring $VERSION from the artifacts bucket..."
            aws s3 cp "s3://$ARTIFACTS_BUCKET/frontend/frontend-$VERSION.tar.gz" restore.tar.gz
            mkdir restore_dir
            tar -xzf restore.tar.gz -C restore_dir
            bash .github/scripts/upload-frontend.sh restore_dir "$FRONTEND_BUCKET" "$VERSION"
          fi

      - name: Switch live version
        run: bash .github/scripts/switch-frontend.sh "$VERSION"
