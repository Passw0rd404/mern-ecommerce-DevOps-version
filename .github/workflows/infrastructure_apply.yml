name: Terraform apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never let two applies touch the same state at once.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: '1.11.0'
  WORKING_DIR: './infrastructure-live-v1/dev'
  AWS_REGION: 'eu-central-1'

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-terraform
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -recursive
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=tfstate-mern-dev-${{ vars.AWS_ACCOUNT_ID }}"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: ${{ env.WORKING_DIR }}

      - name: TFLint Setup
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive -f compact
        working-directory: ./infrastructure-live-v1
        continue-on-error: true

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./infrastructure-live-v1
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=5m -var-file=dev.tfvars -out=tfplan 2>&1 | tee plan.log \
            || { echo "=== ERRORS ==="; grep -n -B2 -A10 'Error:' plan.log; exit 1; }
        working-directory: ${{ env.WORKING_DIR }}
        env:
          MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
          MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}
          TF_VAR_atlas_org_id: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
          TF_VAR_grafana_cloud_access_policy_token: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_grafana_otlp_token: ${{ secrets.GRAFANA_OTLP_TOKEN }}
          TF_VAR_kashier_secret_key: ${{ secrets.KASHIER_SECRET_KEY }}
          TF_VAR_kashier_api_key: ${{ secrets.KASHIER_API_KEY }}
          TF_VAR_kashier_merchant_id: ${{ secrets.KASHIER_MERCHANT_ID }}

      - name: Terraform Apply
        run: |
          set -o pipefail

          DOMAIN=$(grep -Po '(?<=domain_name = ")[^"]+' dev.tfvars)

          # Background watcher: polls ACM directly via AWS CLI, independent of Terraform.
          # Posts the DNS record to the job summary the moment the cert exists and is pending.
          (
            for i in $(seq 1 90); do
              ARN=$(aws acm list-certificates --region us-east-1 \
                --query "CertificateSummaryList[?DomainName=='${DOMAIN}'].CertificateArn | [0]" \
                --output text 2>/dev/null)

              if [ -n "$ARN" ] && [ "$ARN" != "None" ]; then
                STATUS=$(aws acm describe-certificate --region us-east-1 --certificate-arn "$ARN" \
                  --query 'Certificate.Status' --output text)

                if [ "$STATUS" = "PENDING_VALIDATION" ]; then
                  aws acm describe-certificate --region us-east-1 --certificate-arn "$ARN" \
                    --query 'Certificate.DomainValidationOptions[0].ResourceRecord' --output json > rr.json
                  NAME=$(jq -r '.Name' rr.json | sed -E 's/\.[^.]+\.[^.]+\.$//')
                  TARGET=$(jq -r '.Value' rr.json)
                  {
                    echo "## Add this DNS record now — apply is waiting on it"
                    echo "| Field | Value |"
                    echo "|---|---|"
                    echo "| Type | \`CNAME\` |"
                    echo "| Name | \`$NAME\` |"
                    echo "| Target | \`$TARGET\` |"
                    echo "| Proxy status | DNS only (grey cloud) |"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                elif [ "$STATUS" = "ISSUED" ]; then
                  exit 0
                fi
              fi
              sleep 10
            done
          ) &
          WATCHER_PID=$!

          APPLY_EXIT=0
          terraform apply -no-color -input=false -lock-timeout=5m tfplan 2>&1 | tee apply.log || APPLY_EXIT=$?

          kill "$WATCHER_PID" 2>/dev/null || true
          exit $APPLY_EXIT
        working-directory: ${{ env.WORKING_DIR }}
        env:
          MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
          MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}

      - name: Build checklist
        if: always()
        run: |
          LOG="${{ env.WORKING_DIR }}/apply.log"
          [ -f "$LOG" ] || exit 0
          {
            echo "## Apply checklist"
            echo "| Resource | Action | Result |"
            echo "|---|---|---|"
            grep -E ': (Creation|Modifications|Destruction) complete after' "$LOG" \
              | sed -E 's/^([^:]+): (Creation|Modifications|Destruction) complete after.*/| \1 | \2 | ✅ |/'
            awk '/Error: /{m=$0; sub(/^.*Error: /,"",m); gsub(/\|/,"/",m); m=substr(m,1,150)}
                 /^[│ ]*with /{a=$0; sub(/^[│ ]*with /,"",a); sub(/,$/,"",a); printf "| %s | %s | ❌ |\n", a, m}' "$LOG"
          } >> "$GITHUB_STEP_SUMMARY"
