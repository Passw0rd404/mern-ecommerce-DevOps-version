name: Terraform apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never let two applies touch the same state at once.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: '1.11.0'
  WORKING_DIR: './infrastructure-live-v1/dev'
  AWS_REGION: 'eu-central-1'

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-terraform
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -recursive
        working-directory: ./infrastructure-live-v1

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: ${{ env.WORKING_DIR }}

      - name: TFLint Setup
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive -f compact
        working-directory: ./infrastructure-live-v1
        continue-on-error: true

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./infrastructure-live-v1
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
          MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}
          TF_VAR_atlas_org_id: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
          TF_VAR_grafana_cloud_access_policy_token: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_grafana_otlp_token: ${{ secrets.GRAFANA_OTLP_TOKEN }}
          TF_VAR_kashier_secret_key: ${{ secrets.KASHIER_SECRET_KEY }}
          TF_VAR_kashier_api_key: ${{ secrets.KASHIER_API_KEY }}
          TF_VAR_kashier_merchant_id: ${{ secrets.KASHIER_MERCHANT_ID }}

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
          MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}
