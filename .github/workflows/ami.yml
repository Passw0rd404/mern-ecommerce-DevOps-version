name: Build AMI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WORKING_DIR: './infrastructure-live-v1/packer'
  AWS_REGION: 'eu-north-1'

jobs:
  validate-packer:
    name: Validate Packer File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer Init
        run: packer init .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Packer Format Check
        run: packer fmt -check .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Packer Validate
        run: packer validate .
        working-directory: ${{ env.WORKING_DIR }}

  build-ami:
    name: Build AMI
    runs-on: ubuntu-latest
    needs: validate-packer
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer Init
        run: packer init .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Get latest release
        id: latest_release
        run: |
          VERSION=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name // empty')

          if [ -z "$VERSION" ]; then
            echo "No published release found. Create one first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build AMI
        id: build
        run: |
          packer build \
            -var "release_version=${{ steps.latest_release.outputs.version }}" \
            .

          AMI_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d: -f2)
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "Built AMI: $AMI_ID"
        working-directory: ${{ env.WORKING_DIR }}

  verify-ami:
    name: Verify AMI
    runs-on: ubuntu-latest
    needs: build-ami
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AMI is available
        run: |
          AMI_ID="${{ needs.build-ami.outputs.ami_id }}"

          if [ -z "$AMI_ID" ]; then
            echo "No AMI id was produced by the build job."
            exit 1
          fi

          aws ec2 wait image-available --image-ids "$AMI_ID"

          aws ec2 describe-images --image-ids "$AMI_ID" \
            --query 'Images[0].{ID:ImageId,Name:Name,State:State,Arch:Architecture,Created:CreationDate}' \
            --output table

          aws ec2 describe-images --image-ids "$AMI_ID" \
            --query 'Images[0].BlockDeviceMappings' --output table
