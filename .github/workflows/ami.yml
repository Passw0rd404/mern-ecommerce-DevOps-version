name: Build AMI

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release tag to bake into the AMI (e.g. v1.0.0)'
        required: true

permissions:
  contents: read
  id-token: write

env:
  WORKING_DIR: './infrastructure-live-v1/packer'
  AWS_REGION: 'eu-central-1'
  VERSION: ${{ inputs.release_version }}

jobs:
  validate-packer:
    name: Validate Packer File
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer Init
        run: packer init .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Packer Format Check
        run: packer fmt -check .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Packer Validate
        run: |
          packer validate \
            -var "release_version=$VERSION" \
            -var "region=${{ env.AWS_REGION }}" \
            .
        working-directory: ${{ env.WORKING_DIR }}

  build-ami:
    name: Build AMI
    runs-on: ubuntu-latest
    needs: validate-packer
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-packer
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer Init
        run: packer init .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build AMI
        id: build
        run: |
          packer build \
            -var "release_version=$VERSION" \
            -var "region=$AWS_REGION" \
            .

          AMI_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d: -f2)
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "Built AMI: $AMI_ID"
        working-directory: ${{ env.WORKING_DIR }}

  verify-ami:
    name: Verify AMI
    runs-on: ubuntu-latest
    needs: build-ami
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-packer
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AMI is available
        run: |
          AMI_ID="${{ needs.build-ami.outputs.ami_id }}"

          if [ -z "$AMI_ID" ]; then
            echo "No AMI id was produced by the build job."
            exit 1
          fi

          aws ec2 wait image-available --image-ids "$AMI_ID"

          aws ec2 describe-images --image-ids "$AMI_ID" \
            --query 'Images[0].{ID:ImageId,Name:Name,State:State,Arch:Architecture,Created:CreationDate}' \
            --output table

          aws ec2 describe-images --image-ids "$AMI_ID" \
            --query 'Images[0].BlockDeviceMappings' --output table
