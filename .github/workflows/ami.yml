name: Terraform apply

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PKR_VERSION: '1.8.0'
  WORKING_DIR: './infrastructure-live-v1/packer'
  REGION: 'eu-north-1'

jobs:
  validate-packer:
    name: Validate Packer File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer Init
        run: packer init ${{ env.WORKING_DIR }}

      - name: Packer Validate
        run: packer validate ${{ env.WORKING_DIR }}

      - name: Packer Format Check
        run: packer fmt -check ${{ env.WORKING_DIR }}

  build-ami:
    name: Build AMI
    runs-on: ubuntu-latest
    needs: validate-packer
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer Init
        run: packer init ${{ env.WORKING_DIR }}

      - name: Get latest release
        id: latest_release
        run: |
            VERSION=$(curl -s -f https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name')
            echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build AMI
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          packer build -machine-readable -var "release_version=${{ steps.latest_release.outputs.version }}" main.pkr.hcl \
          | tee packer.txt
          AMI_ID=$(grep 'artifact,0,id' packer.txt | cut -d, -f6 | cut -d: -f2)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Built AMI: $AMI_ID"

  verify-ami:
    name: Verify AMI
    runs-on: ubuntu-latest
    needs: build-ami
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Check AMI exists and is available
        run: |
          AMI_ID=${{ needs.build-ami.outputs.ami_id }}
          echo "Checking AMI: $AMI_ID"

          STATE=$(aws ec2 describe-images \
            --image-ids $AMI_ID \
            --query 'Images[0].State' \
            --output text)

          echo "AMI State: $STATE"

          if [ "$STATE" != "available" ]; then
            echo "AMI is not in available state!"
            exit 1
          fi
      - name: Check AMI tags
        run: |
          AMI_ID=${{ needs.build-ami.outputs.ami_id }}

          aws ec2 describe-images \
            --image-ids $AMI_ID \
            --query 'Images[0].Tags' \
            --output table

      - name: Check AMI block device mappings
        run: |
          AMI_ID=${{ needs.build-ami.outputs.ami_id }}

          aws ec2 describe-images \
            --image-ids $AMI_ID \
            --query 'Images[0].BlockDeviceMappings' \
            --output table

      - name: Print AMI summary
        run: |
          AMI_ID=${{ needs.build-ami.outputs.ami_id }}

          aws ec2 describe-images \
            --image-ids $AMI_ID \
            --query 'Images[0].{ID:ImageId, Name:Name, State:State, CreationDate:CreationDate}' \
            --output table