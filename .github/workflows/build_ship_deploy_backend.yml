name: Backend - Build and Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.release.tag_name || github.sha }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  CODEDEPLOY_APP_NAME: ${{ secrets.CODEDEPLOY_APP_NAME }}
  CODEDEPLOY_GROUP_NAME: ${{ secrets.CODEDEPLOY_GROUP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Production dependencies are installed inside deploy/, so the cached
      # root node_modules is never touched.
      - name: Create backend artifact
        run: |
          mkdir deploy
          cp -r scripts backend deploy/
          cp appspec.yml package.json package-lock.json ecosystem.config.cjs tracing.js deploy/
          chmod +x deploy/scripts/*.sh
          npm ci --omit=dev --prefix deploy
          tar -czf backend-artifact.tar.gz -C deploy .

      # The bucket is versioned, so pin CodeDeploy to the exact object we upload
      - name: Ship to S3 and start deployment
        run: |
          KEY="backend/backend-${VERSION}.tar.gz"

          VERSION_ID=$(aws s3api put-object \
            --bucket "$S3_BUCKET_NAME" --key "$KEY" \
            --body backend-artifact.tar.gz \
            --query VersionId --output text)

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP_NAME" \
            --deployment-group-name "$CODEDEPLOY_GROUP_NAME" \
            --s3-location "bucket=$S3_BUCKET_NAME,key=$KEY,bundleType=tgz,version=$VERSION_ID" \
            --file-exists-behavior OVERWRITE \
            --description "Backend $VERSION" \
            --query deploymentId --output text)

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "Started deployment $DEPLOYMENT_ID"

      - name: Wait for deployment
        run: |
          if ! aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"; then
            aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
              --query 'deploymentInfo.{status:status,error:errorInformation,rollback:rollbackInfo}' \
              --output json
            exit 1
          fi
          echo "Deployment $DEPLOYMENT_ID succeeded"
