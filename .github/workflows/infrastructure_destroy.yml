name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-dev" to confirm'
        required: true
      delete_amis:
        description: 'Also delete the Packer AMIs and their snapshots'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: '1.11.0'
  WORKING_DIR: './infrastructure-live-v1/dev'
  AWS_REGION: 'eu-central-1'

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy-dev" ]; then
            echo "Confirmation text did not match. Nothing was destroyed."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-terraform
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ${{ env.WORKING_DIR }}

      # The app bucket denies deletes from outside the VPC, so remove its policy first
      - name: Remove the app bucket policy so the bucket can be emptied
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          aws s3api delete-bucket-policy --bucket "mern-dev-${ACCOUNT}-app" || true

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false -lock-timeout=5m
        working-directory: ${{ env.WORKING_DIR }}
        env:
          MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
          MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}
          TF_VAR_atlas_org_id: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
          TF_VAR_grafana_cloud_access_policy_token: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_grafana_otlp_token: ${{ secrets.GRAFANA_OTLP_TOKEN }}
          TF_VAR_kashier_secret_key: ${{ secrets.KASHIER_SECRET_KEY }}
          TF_VAR_kashier_api_key: ${{ secrets.KASHIER_API_KEY }}
          TF_VAR_kashier_merchant_id: ${{ secrets.KASHIER_MERCHANT_ID }}

      # Must run after the destroy: Terraform reads the AMI while it plans the destroy
      - name: Delete Packer AMIs and snapshots
        if: ${{ inputs.delete_amis }}
        run: |
          for AMI in $(aws ec2 describe-images --owners self \
                --filters "Name=tag:Project,Values=mern" \
                --query 'Images[].ImageId' --output text); do
            SNAPSHOTS=$(aws ec2 describe-images --image-ids "$AMI" \
              --query 'Images[0].BlockDeviceMappings[].Ebs.SnapshotId' --output text)
            aws ec2 deregister-image --image-id "$AMI"
            for SNAPSHOT in $SNAPSHOTS; do
              aws ec2 delete-snapshot --snapshot-id "$SNAPSHOT"
            done
          done

      - name: List anything still tagged Project=mern
        run: |
          for REGION in eu-central-1 us-east-1; do
            echo "--- $REGION ---"
            aws resourcegroupstaggingapi get-resources --region "$REGION" \
              --tag-filters Key=Project,Values=mern \
              --query 'ResourceTagMappingList[].ResourceARN' --output text | tr '\t' '\n'
          done
