name: Load deploy config
description: Reads the config Terraform published to SSM and exports it as env vars
inputs:
  environment:
    description: Environment name, matches env in the deploy_config module
    default: dev
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PARAM_NAME: /mern/${{ inputs.environment }}/deploy-config
      run: |
        # Terraform stores the non-secret deployment values as JSON; exporting
        # each entry through GITHUB_ENV makes them available to later steps.
        CONFIG=$(aws ssm get-parameter --name "$PARAM_NAME" \
          --query Parameter.Value --output text)
        echo "$CONFIG" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
