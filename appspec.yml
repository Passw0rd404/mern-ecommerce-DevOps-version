version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/ecommerce-backend

hooks:
  ApplicationStop:
    - location: scripts/application-stop.sh
      timeout: 300
      runas: ec2-user
  BeforeInstall:
    - location: scripts/before-install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/after-install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/application-start.sh
      timeout: 300
      runas: ec2-user
  ValidateService:
    - location: scripts/validate-service.sh
      timeout: 300
      runas: ec2-user

permissions:
  - object: /home/ec2-user/ecommerce-backend/scripts
    pattern: "*.sh"
    mode: 755
    owner: ec2-user
    group: ec2-user